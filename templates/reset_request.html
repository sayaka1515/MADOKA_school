{% extends "base.html" %}
{% block content %}
<div class="form-container">
  <h2>重設密碼</h2>
  <form method="POST" action="">
    {{ form.hidden_tag() }}
    <div class="form-group">
      {{ form.email.label }}<br>
      {{ form.email(class="form-control") }}
    </div>
    <div class="form-group">
      {{ form.submit(class="btn") }}
    </div>
  </form>
  <p><a href="{{ url_for('auth.login') }}">返回登入</a></p>
</div>
{% endblock %}
