{% extends "base.html" %}
{% block title %}首頁 - 見瀧原中學校{% endblock %}
{% block content %}
<div class="hero">
    <div class="hero-card">
        {% if username %}
            <h2>歡迎回來，{{ username }}！</h2>
        {% else %}
            <h2>歡迎來到見瀧原中學</h2>
            <p>請先<a href="{{ url_for('auth.login') }}">登入</a>或<a href="{{ url_for('auth.register') }}">註冊</a>。</p>
        {% endif %}
        <a class="btn" href="{{ url_for('main.about') }}">立即探索</a>
    </div>
</div>
{% endblock %}
