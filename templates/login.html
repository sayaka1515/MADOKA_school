{% extends "base.html" %}
{% block content %}
<div class="form-container">
    <h2>登入見瀧原中學帳號</h2>
    <form method="POST" action="">
        {{ form.hidden_tag() }}
        <div>{{ form.email.label }} {{ form.email }}</div>
        <div>{{ form.password.label }} {{ form.password }}</div>
        <div>{{ form.remember }} {{ form.remember.label }}</div>
        <div>{{ form.submit }}</div>
    </form>
</div>
{% endblock %}
