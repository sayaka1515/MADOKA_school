{% extends "base.html" %}
{% block content %}
<div class="form-container">
    <h2>登入帳號</h2>
    <form method="POST" action="{{ url_for('auth.login') }}">
        {{ form.hidden_tag() }}
        <div class="form-group">
            {{ form.email.label }}<br>
            {{ form.email(size=30) }}
        </div>
        <div class="form-group">
            {{ form.password.label }}<br>
            {{ form.password(size=30) }}
        </div>
        <div class="form-group">
            {{ form.submit(class="btn") }}
        </div>
    </form>
    <p>還沒有帳號？<a href="{{ url_for('auth.register') }}">註冊</a></p>
</div>
{% endblock %}
